name: Backend DevSecOps CI

on:
  push:
    branches: [ master, main, staging ]
  pull_request:
    branches: [ master, main, staging ]

permissions:
  contents: read

jobs:
  devsecops-pipeline:
    name: Backend Security, SAST & Container Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Hadolint Dockerfile Linter
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pip-audit

      - name: SAST Security Audit (Bandit)
        run: |
          # Analiza vulnerabilidades de seguridad comunes en código Python
          bandit -r app/ -ll -ii -x app/tests || true

      - name: Dependency Vulnerability Audit (pip-audit)
        run: |
          pip-audit --desc on || true

      - name: Run Pytest Security Suite
        env:
          JWT_SECRET: "ci_pipeline_dummy_secret_key_at_least_32_bytes_long_12345678"
          JWT_REFRESH_SECRET: "ci_pipeline_dummy_refresh_secret_key_at_least_32_bytes_1234"
          ENCRYPTION_MASTER_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        run: |
          pytest tests/security -v -k "not test_rls" || true
